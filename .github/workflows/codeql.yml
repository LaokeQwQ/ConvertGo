name: CodeQL

on:
  pull_request:
    branches: [dev, master]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [dev]
  schedule:
    - cron: '31 4 * * 1'

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build embedded frontend assets
        working-directory: frontend
        run: npm run build
      - name: Initialize Go analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: go
          build-mode: manual
      - name: Build Go packages for CodeQL
        run: go build -tags webkit2_41 ./...
      - name: Analyze Go and upload SARIF
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:go
          upload: always

  analyze-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Initialize JavaScript and TypeScript analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - frontend/wailsjs/**
              - frontend/dist/**
              - frontend/node_modules/**
      - name: Analyze JavaScript and TypeScript and upload SARIF
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
          upload: always
